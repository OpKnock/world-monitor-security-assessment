<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a13">
<meta name="description" content="World Monitor — Security Assessment Platform · detect, verify, score and remediate vulnerabilities on authorized targets.">
<title>World Monitor · Security Assessment Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23060a13'/><path d='M16 4l9 4v7c0 6-4 10-9 13-5-3-9-7-9-13V8z' fill='none' stroke='%2322d3ee' stroke-width='1.7'/><circle cx='16' cy='14.5' r='3' fill='%2322d3ee'/><path d='M16 17.5v4' stroke='%2322d3ee' stroke-width='1.4' stroke-linecap='round'/></svg>">
</head>
<body>
<div id="app">
  <!-- ── sidebar ── -->
  <aside id="sidebar" class="hidden" aria-label="Primary navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0b1630"/><rect x=".7" y=".7" width="30.6" height="30.6" rx="7.3" stroke="rgba(34,211,238,.18)"/><path d="M16 4.2L25 8.3v6.7c0 5.7-3.7 9.6-9 12.6C10.7 24.6 7 20.7 7 15V8.3L16 4.2Z" stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="14.2" r="2.9" fill="#22d3ee"/><path d="M16 17.1v3.6" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text"><strong>WORLD MONITOR</strong><span>Security Assessment</span></div>
      <span class="brand-live" title="Live platform"><i></i> LIVE</span>
    </div>

    <nav aria-label="Sections">
      <a href="#/dashboard" data-nav>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.35"/><rect x="9.3" y="1.5" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.35"/><rect x="1.5" y="9.3" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.35"/><rect x="9.3" y="9.3" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.35"/></svg>
        Dashboard
      </a>
      <a href="#/assess/new" data-nav>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.4" stroke="currentColor" stroke-width="1.35"/><path d="M8 5.2v5.6M5.2 8h5.6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
        New Assessment
      </a>
      <a href="#/findings" data-nav>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.2l5.4 2.4v3.9c0 3-2.3 5.2-5.4 6.7C4.9 13.7 2.6 11.5 2.6 8.5V4.6L8 2.2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><circle cx="8" cy="7.7" r="2" stroke="currentColor" stroke-width="1.25"/><path d="M8 9.7v1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Findings
      </a>
      <a href="#/history" data-nav>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.4" stroke="currentColor" stroke-width="1.35"/><path d="M8 5.2v3.1l2.2 1.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        History
      </a>
      <a href="#/reports" data-nav>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 2h4.2L11.5 4.5V14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M9.1 2.2V4.7H11.4" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M6.2 8.2h3.6M6.2 10.7h3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Reports
      </a>
      <a href="#/settings" data-nav>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.6" stroke="currentColor" stroke-width="1.35"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8H3M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="lab-row">
        <span class="pill lab">● LAB MODE</span>
        <span class="pill env">LOOPBACK ONLY</span>
      </div>
      <div class="userchip" id="userChip">
        <div class="avatar" aria-hidden="true">?</div>
        <div class="who"><b>—</b><span>—</span></div>
        <span class="who-dot" title="Authenticated"></span>
      </div>
      <button id="logout" class="ghost" style="width:100%">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.2H3.5A1 1 0 0 0 2.5 4.2v7.6A1 1 0 0 0 3.5 12.8H6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M11.2 11L13.5 8 11.2 5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 8H6.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Sign out
      </button>
      <div class="sidebar-legal">© World Monitor · AGPL-3.0 · <a href="/api/docs" target="_blank" rel="noopener">API</a></div>
    </div>
  </aside>

  <!-- ── main ── -->
  <div class="main-wrap">
    <header id="topbar" class="hidden" aria-label="Page header">
      <button id="menuBtn" class="icon-btn" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
      <div class="topbar-actions">
        <a class="topbar-link" href="#/assess/new">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          New scan
        </a>
        <span class="topbar-sep" aria-hidden="true"></span>
        <span id="healthDot" class="health" title="Platform health"><i></i> checking…</span>
      </div>
    </header>

    <main id="main"><section id="view" aria-live="polite" aria-busy="false"></section></main>

    <footer id="appFooter" class="hidden">
      <span class="footer-left">World Monitor Security Assessment Platform · <span id="footerVer">v1.0.0</span> · LAB_MODE · loopback-only gate</span>
      <span class="footer-right"><a href="/api/docs" target="_blank" rel="noopener">OpenAPI</a> · <a href="/api/health" target="_blank" rel="noopener">/health</a> · <span class="mono muted">AGPL-3.0</span></span>
    </footer>
  </div>
</div>

<!-- active-run floating banner -->
<div id="runBanner" style="display:none" role="status" aria-live="polite"></div>

<!-- mobile scrim -->
<div id="scrim" class="scrim hidden" aria-hidden="true"></div>

<!-- toasts -->
<div id="toast" aria-live="polite" aria-atomic="false"></div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/charts.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
