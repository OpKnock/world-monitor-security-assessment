name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  security-events: write  # for SARIF upload
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q --import-mode=importlib
      - run: pip-audit --desc
      - run: pip check

  quality-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Run quality gate CLI - exits 1 on BLOCKED
      - name: Run Security Quality Gate
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from backend.app.engine.quality_gate import cli_check
          # Example: would be called with real data from assessment
          # cli_check(counts={'CRITICAL': 0, 'HIGH': 1}, health_score=85, has_incomplete=False, has_failed=False)
          print('Quality gate check available - integrate with assessment results')
          "
      # Generate SBOM
      - name: Generate SBOM
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from backend.app.engine.sbom import generate_sbom_json
          print(generate_sbom_json('ci-test', '.'))
          " > sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  sarif:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate SARIF (example)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from backend.app.engine.sarif import to_sarif_json
          print(to_sarif_json([], 'ci-test'))
          " > results.sarif
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: world-monitor

  docker:
    runs-on: ubuntu-latest
    needs: [test, quality-gate, sarif]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -f docker/api.Dockerfile -t world-monitor:api .
      - run: docker build -f docker/lab.Dockerfile -t world-monitor:lab .
      - run: docker run --rm -d -p 8000:8000 --name api world-monitor:api && sleep 15 && (curl -fsS http://localhost:8000/api/health | grep -q healthy || (echo "--- api logs ---" && docker logs api && docker rm -f api && exit 1)) && docker rm -f api

  release-gate:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Release Security Gate
        run: |
          echo "::notice::Release Security Gate - all quality checks passed"
          echo "This job would evaluate the latest assessment and decide BLOCKED/APPROVED"
          echo "Integrate with backend.app.engine.policy.evaluate_policy()"