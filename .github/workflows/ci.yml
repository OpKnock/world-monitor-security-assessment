name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q --import-mode=importlib
      - run: pip-audit --desc
      - run: pip check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -f docker/api.Dockerfile -t world-monitor:api .
      - run: docker build -f docker/lab.Dockerfile -t world-monitor:lab .
      - run: docker run --rm -d -p 8000:8000 --name api world-monitor:api && sleep 15 && (curl -fsS http://localhost:8000/api/health | grep -q healthy || (echo "--- api logs ---" && docker logs api && docker rm -f api && exit 1)) && docker rm -f api
